<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Density Waves — Spiral Arms Without Gravity</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@500;700;800&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #050208;
    --fg: #f5f0ff;
    --muted: #8a7da5;
    --muted-dim: #5a4d75;
    --accent: #ff7ba8;
    --accent2: #6bd5ff;
    --accent3: #ffd870;
    --glass: rgba(20, 10, 35, 0.55);
    --border: rgba(255, 255, 255, 0.08);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    overflow: hidden;
    background: #000;
    color: var(--fg);
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    cursor: grab;
    user-select: none;
    -webkit-user-select: none;
  }
  body.dragging { cursor: grabbing; }
  #sky {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    touch-action: none;
  }
  .hud { position: fixed; pointer-events: none; z-index: 10; }
  .hud > * { pointer-events: auto; }
  .hud-top-left { top: 22px; left: 22px; max-width: 330px; }
  .hud-top-right { top: 22px; right: 22px; text-align: right; }
  .hud-bottom {
    bottom: 22px; left: 50%; transform: translateX(-50%);
    text-align: center; color: var(--muted-dim);
    font-size: 10px; letter-spacing: 0.25em; text-transform: uppercase;
    white-space: nowrap;
  }
  .panel {
    background: var(--glass);
    backdrop-filter: blur(20px) saturate(120%);
    -webkit-backdrop-filter: blur(20px) saturate(120%);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 18px 20px;
    box-shadow: 0 20px 60px -20px rgba(0, 0, 0, 0.6);
  }
  .title {
    font-family: 'Syne', sans-serif;
    font-weight: 800;
    font-size: 26px;
    line-height: 0.95;
    letter-spacing: -0.02em;
    background: linear-gradient(135deg, #fff 0%, #ffd870 35%, #ff7ba8 65%, #6bd5ff 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    color: transparent;
    margin-bottom: 4px;
  }
  .subtitle {
    font-size: 9px; color: var(--muted);
    letter-spacing: 0.22em; text-transform: uppercase;
    margin-bottom: 16px; line-height: 1.4;
  }
  .stats {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 2px 16px;
    font-size: 11px;
    margin-bottom: 4px;
  }
  .stat {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding: 4px 0;
    border-bottom: 1px dashed rgba(255,255,255,0.04);
  }
  .stat-label { color: var(--muted); font-size: 9px; letter-spacing: 0.15em; text-transform: uppercase; }
  .stat-value { color: var(--fg); font-weight: 500; font-feature-settings: 'tnum'; }
  .controls { margin-top: 14px; display: flex; flex-direction: column; gap: 12px; }
  .control-row { display: flex; flex-direction: column; gap: 6px; }
  .control-label {
    font-size: 9px; color: var(--muted);
    letter-spacing: 0.18em; text-transform: uppercase;
    display: flex; justify-content: space-between; align-items: center;
  }
  .control-value { color: var(--fg); font-weight: 500; }
  input[type=range] {
    -webkit-appearance: none; appearance: none;
    width: 100%; height: 4px;
    background: rgba(255,255,255,0.06);
    border-radius: 2px; outline: none; cursor: pointer;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 14px; height: 14px;
    background: linear-gradient(135deg, #ff7ba8, #ffd870);
    border-radius: 50%; cursor: pointer;
    box-shadow: 0 0 12px rgba(255, 123, 168, 0.5);
    border: none;
  }
  input[type=range]::-moz-range-thumb {
    width: 14px; height: 14px;
    background: linear-gradient(135deg, #ff7ba8, #ffd870);
    border-radius: 50%; cursor: pointer; border: none;
  }
  .btn-row { display: flex; gap: 6px; flex-wrap: wrap; }
  .btn {
    flex: 1;
    background: rgba(255,255,255,0.025);
    border: 1px solid var(--border);
    color: var(--muted);
    padding: 8px 8px;
    border-radius: 8px;
    font-family: inherit;
    font-size: 9px; letter-spacing: 0.15em; text-transform: uppercase;
    cursor: pointer;
    transition: all 0.2s ease;
    text-align: center;
  }
  .btn:hover { background: rgba(255,255,255,0.06); color: var(--fg); }
  .btn.active {
    background: rgba(107, 213, 255, 0.12);
    border-color: rgba(107, 213, 255, 0.4);
    color: var(--accent2);
    box-shadow: 0 0 16px rgba(107, 213, 255, 0.2);
  }
  .legend {
    display: flex; flex-direction: column; gap: 6px; align-items: flex-end;
    background: var(--glass);
    backdrop-filter: blur(20px) saturate(120%);
    -webkit-backdrop-filter: blur(20px) saturate(120%);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 18px;
  }
  .legend-item {
    display: flex; align-items: center; gap: 10px;
    font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--muted);
  }
  .legend-item .ldot { width: 6px; height: 6px; border-radius: 50%; }
  .legend-item .count {
    color: var(--fg); font-weight: 500;
    min-width: 60px; text-align: right;
    font-feature-settings: 'tnum';
  }
  .legend-item.disk .ldot { background: #b4c8ff; box-shadow: 0 0 8px #b4c8ff; }
  .legend-item.arm .ldot { background: #ff7ba8; box-shadow: 0 0 8px #ff7ba8; }
  .legend-item.bulge .ldot { background: #ffd870; box-shadow: 0 0 8px #ffd870; }
  @media (max-width: 720px) {
    .hud-top-left { max-width: calc(100% - 24px); top: 12px; left: 12px; }
    .hud-top-right { top: auto; bottom: 12px; right: 12px; }
    .title { font-size: 20px; }
    .hud-bottom { display: none; }
    .panel { padding: 14px 16px; }
    .stats { font-size: 10px; }
  }
</style>
</head>
<body>
  <canvas id="sky"></canvas>
  
  <div class="hud hud-top-left">
    <div class="panel">
      <div class="title">Density Waves</div>
      <div class="subtitle">Slow-field damping · Spiral arms without gravity</div>
      
      <div class="stats">
        <div class="stat"><span class="stat-label">Stars</span><span class="stat-value" id="stat-stars">—</span></div>
        <div class="stat"><span class="stat-label">FPS</span><span class="stat-value" id="stat-fps">—</span></div>
        <div class="stat"><span class="stat-label">Pattern Ω</span><span class="stat-value" id="stat-omega">0.15</span></div>
        <div class="stat"><span class="stat-label">Pitch</span><span class="stat-value" id="stat-pitch">15°</span></div>
      </div>
      
      <div class="controls">
        <div class="control-row">
          <div class="control-label">
            <span>Time Flow</span>
            <span class="control-value" id="speed-val">1.00×</span>
          </div>
          <input type="range" id="speed" min="0" max="500" value="100">
        </div>
        
        <div class="control-row">
          <div class="control-label">
            <span>Damping Strength</span>
            <span class="control-value" id="damp-val">0.70</span>
          </div>
          <input type=range id="damp" min="0" max="90" value="70">
        </div>
        
        <div class="control-row">
          <div class="control-label">
            <span>Pattern Speed</span>
            <span class="control-value" id="omega-val">0.15</span>
          </div>
          <input type=range id="omega" min="0" max="80" value="15">
        </div>
        
        <div class="control-row">
          <div class="control-label">
            <span>Pitch Angle</span>
            <span class="control-value" id="pitch-val">15°</span>
          </div>
          <input type=range id="pitch" min="5" max="35" value="15">
        </div>
        
        <div class="control-row">
          <div class="control-label">
            <span>Spiral Arms</span>
            <span class="control-value" id="arms-val">2</span>
          </div>
          <input type=range id="arms" min="1" max="5" value="2">
        </div>
        
        <div class="control-row">
          <div class="control-label"><span>Visualize</span></div>
          <div class="btn-row">
            <button class="btn" id="btn-field">Slow Field</button>
            <button class="btn" id="btn-trails">Trails</button>
            <button class="btn" id="btn-reset">Reset View</button>
          </div>
        </div>
      </div>
    </div>
  </div>
  
  <div class="hud hud-top-right">
    <div class="legend">
      <div class="legend-item disk"><span>Disk Stars</span><span class="count" id="cnt-disk">—</span></div>
      <div class="legend-item arm"><span>Arm Jam</span><span class="count" id="cnt-arm">—</span></div>
      <div class="legend-item bulge"><span>Bulge</span><span class="count" id="cnt-bulge">—</span></div>
    </div>
  </div>
  
  <div class="hud hud-bottom">
    Drag to rotate · Scroll to zoom · Slow zones create traffic jams of stars
  </div>
  
  <script>
  'use strict';

  const canvas = document.getElementById('sky');
  const ctx = canvas.getContext('2d');

  let W, H, DPR;
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W * DPR;
    canvas.height = H * DPR;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  window.addEventListener('resize', resize);
  resize();

  // ======== STAR COUNTS ========
  const N_DISK = 15000;
  const N_BULGE = 4000;

  // ======== PER-STAR ARRAYS ========
  const r_arr = new Float32Array(N_DISK);
  const theta_arr = new Float32Array(N_DISK);
  const z_amp_arr = new Float32Array(N_DISK);
  const z_phase_arr = new Float32Array(N_DISK);
  const log_r_arr = new Float32Array(N_DISK);
  const brightness_arr = new Float32Array(N_DISK);
  const omega_base_arr = new Float32Array(N_DISK);

  const bulge_r = new Float32Array(N_BULGE);
  const bulge_theta = new Float32Array(N_BULGE);
  const bulge_node = new Float32Array(N_BULGE);
  const bulge_incl = new Float32Array(N_BULGE);
  const bulge_omega = new Float32Array(N_BULGE);

  function init() {
    const V0 = 1.8;
    for(let i=0; i<N_DISK; i++) {
      let r = 0.2 + Math.pow(Math.random(), 0.6) * 6.5;
      r_arr[i] = r;
      theta_arr[i] = Math.random() * Math.PI * 2;
      z_amp_arr[i] = (0.05 + 0.35 * Math.random()) * Math.exp(-r * 0.1);
      z_phase_arr[i] = Math.random() * Math.PI * 2;
      log_r_arr[i] = Math.log(r);
      brightness_arr[i] = 0.4 + 0.6 * Math.random();
      omega_base_arr[i] = V0 / (r + 0.2);
    }
    
    for(let i=0; i<N_BULGE; i++) {
      bulge_r[i] = 0.1 + Math.pow(Math.random(), 2.0) * 0.8;
      bulge_theta[i] = Math.random() * Math.PI * 2;
      bulge_node[i] = Math.random() * Math.PI * 2;
      bulge_incl[i] = Math.acos(2 * Math.random() - 1);
      bulge_omega[i] = 1.5 / Math.max(0.2, bulge_r[i]);
    }
  }
  init();

  // ======== SPRITES ========
  function makeSprite(color) {
    const c = document.createElement('canvas');
    c.width = c.height = 8;
    const cctx = c.getContext('2d');
    const g = cctx.createRadialGradient(4, 4, 0, 4, 4, 4);
    g.addColorStop(0, color);
    g.addColorStop(0.5, color.replace('1)', '0.4)'));
    g.addColorStop(1, color.replace('1)', '0)'));
    cctx.fillStyle = g;
    cctx.fillRect(0,0,8,8);
    return c;
  }
  const spriteDisk = makeSprite('rgba(180, 210, 255, 1)');
  const spriteArm = makeSprite('rgba(255, 140, 200, 1)');
  const spriteBulge = makeSprite('rgba(255, 200, 100, 1)');

  // ======== STATE ========
  let speed = 1.0;
  let damping_strength = 0.70;
  let Omega_p = 0.15;
  let pitch_deg = 15;
  let num_arms = 2;
  let arm_offset = 2 * Math.PI / num_arms;
  
  // Accumulated pattern phase to prevent jumps when Omega_p changes
  let pattern_phase = 0; 

  let showField = false;
  let showTrails = false;

  let rotZ = 0;
  let tilt = 1.2;
  let zoom = 1.0;
  let tRotZ = rotZ, tTilt = tilt, tZoom = zoom;
  
  let isDragging = false;
  let lastX = 0, lastY = 0;

  const camDist = 12;

  // ======== RENDER ========
  function render(dt) {
    const tan_pitch = Math.tan(pitch_deg * Math.PI / 180);
    const sigma = 0.25;
    const sigma_sq2 = 2 * sigma * sigma;
    
    const cosR = Math.cos(rotZ), sinR = Math.sin(rotZ);
    const cosT = Math.cos(tilt), sinT = Math.sin(tilt);
    
    const cxS = W / 2, cyS = H / 2;
    const scale = Math.min(W, H) / 14 * zoom;

    // Background
    if (showTrails) {
      ctx.globalCompositeOperation = 'source-over';
      ctx.fillStyle = 'rgba(5, 2, 8, 0.15)';
      ctx.fillRect(0, 0, W, H);
    } else {
      ctx.globalCompositeOperation = 'source-over';
      const grad = ctx.createRadialGradient(cxS, cyS, 0, cxS, cyS, Math.max(W, H));
      grad.addColorStop(0, '#0a0512');
      grad.addColorStop(1, '#020108');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, W, H);
      
      // Core glow
      const coreGrad = ctx.createRadialGradient(cxS, cyS, 0, cxS, cyS, Math.min(W, H) * 0.15 * zoom);
      coreGrad.addColorStop(0, 'rgba(255, 220, 150, 0.5)');
      coreGrad.addColorStop(0.3, 'rgba(255, 150, 100, 0.15)');
      coreGrad.addColorStop(1, 'rgba(255, 100, 50, 0)');
      ctx.fillStyle = coreGrad;
      ctx.fillRect(0, 0, W, H);
    }

    ctx.globalCompositeOperation = 'lighter';

    // Draw Slow Field (Proper 3D Spiral Curves)
    if (showField) {
      ctx.lineCap = 'round';
      
      for (let arm = 0; arm < num_arms; arm++) {
        const arm_phase = arm * arm_offset;
        
        // Draw central spiral line
        ctx.beginPath();
        for (let i = 0; i <= 100; i++) {
          const r = 0.5 + i * 0.09;
          const base_theta = Math.log(r) / tan_pitch + pattern_phase + arm_phase;
          const px = r * Math.cos(base_theta);
          const py = r * Math.sin(base_theta);
          
          const rx = px * cosR - py * sinR;
          const ry = px * sinR + py * cosR;
          
          const proj_y = ry * cosT;
          const proj_z = ry * sinT;
          const proj_scale = camDist / (camDist + proj_z);
          const sx = cxS + rx * scale * proj_scale;
          const sy = cyS + proj_y * scale * proj_scale;
          
          if (i === 0) ctx.moveTo(sx, sy);
          else ctx.lineTo(sx, sy);
        }
        ctx.strokeStyle = 'rgba(255, 80, 150, 0.8)';
        ctx.lineWidth = 2.5;
        ctx.stroke();
        
        // Draw Gaussian width boundaries
        for (let off = -3; off <= 3; off++) {
          if (off === 0) continue;
          const theta_off = off * 0.12;
          const alpha = Math.exp(-(theta_off * theta_off) / sigma_sq2) * 0.4;
          
          ctx.beginPath();
          for (let i = 0; i <= 100; i++) {
            const r = 0.5 + i * 0.09;
            const base_theta = Math.log(r) / tan_pitch + pattern_phase + arm_phase + theta_off;
            const px = r * Math.cos(base_theta);
            const py = r * Math.sin(base_theta);
            
            const rx = px * cosR - py * sinR;
            const ry = px * sinR + py * cosR;
            
            const proj_y = ry * cosT;
            const proj_z = ry * sinT;
            const proj_scale = camDist / (camDist + proj_z);
            const sx = cxS + rx * scale * proj_scale;
            const sy = cyS + proj_y * scale * proj_scale;
            
            if (i === 0) ctx.moveTo(sx, sy);
            else ctx.lineTo(sx, sy);
          }
          ctx.strokeStyle = `rgba(255, 80, 150, ${alpha})`;
          ctx.lineWidth = 1.5;
          ctx.stroke();
        }
      }
    }

    // Draw Bulge Stars
    for (let i = 0; i < N_BULGE; i++) {
      bulge_theta[i] += bulge_omega[i] * dt;
      if (bulge_theta[i] > Math.PI * 2) bulge_theta[i] -= Math.PI * 2;
      
      const r = bulge_r[i];
      const th = bulge_theta[i];
      const cos_th = Math.cos(th);
      const sin_th = Math.sin(th);
      
      const x0 = r * cos_th;
      const y0 = r * sin_th;
      const cO = Math.cos(bulge_node[i]);
      const sO = Math.sin(bulge_node[i]);
      const x1 = x0 * cO - y0 * sO;
      const y1 = x0 * sO + y0 * cO;
      const cI = Math.cos(bulge_incl[i]);
      const sI = Math.sin(bulge_incl[i]);
      const px = x1;
      const py = y1 * cI;
      const pz = y1 * sI;
      
      const rx = px * cosR - py * sinR;
      const ry = px * sinR + py * cosR;
      
      const proj_y = ry * cosT - pz * sinT;
      const proj_z = ry * sinT + pz * cosT;
      
      const proj_scale = camDist / (camDist + proj_z);
      const sx = (cxS + rx * scale * proj_scale) | 0;
      const sy = (cyS + proj_y * scale * proj_scale) | 0;
      
      ctx.globalAlpha = 0.8 * proj_scale;
      ctx.drawImage(spriteBulge, sx - 3, sy - 3, 6, 6);
    }

    // Draw Disk Stars (Density Wave Damping)
    let arm_count = 0;
    
    for (let i = 0; i < N_DISK; i++) {
      const r = r_arr[i];
      // Use accumulated pattern_phase instead of time * speed
      const base_arm = log_r_arr[i] / tan_pitch + pattern_phase;
      
      // Robust modulo mapping to find closest arm
      let delta_theta = (theta_arr[i] - base_arm) % arm_offset;
      if (delta_theta < 0) delta_theta += arm_offset;
      if (delta_theta > arm_offset / 2) delta_theta -= arm_offset;
      
      // Gaussian damping field
      const D = Math.exp(-(delta_theta * delta_theta) / sigma_sq2);
      
      // Slow down star inside the field
      const omega = omega_base_arr[i] * (1 - damping_strength * D);
      
      theta_arr[i] += omega * dt;
      if (theta_arr[i] > Math.PI * 2) theta_arr[i] -= Math.PI * 2;
      else if (theta_arr[i] < 0) theta_arr[i] += Math.PI * 2;
      
      const th = theta_arr[i];
      const cos_th = Math.cos(th);
      const sin_th = Math.sin(th);
      
      const px = r * cos_th;
      const py = r * sin_th;
      const pz = z_amp_arr[i] * Math.sin(th * 2 + z_phase_arr[i]);
      
      const rx = px * cosR - py * sinR;
      const ry = px * sinR + py * cosR;
      
      const proj_y = ry * cosT - pz * sinT;
      const proj_z = ry * sinT + pz * cosT;
      
      const proj_scale = camDist / (camDist + proj_z);
      const sx = (cxS + rx * scale * proj_scale) | 0;
      const sy = (cyS + proj_y * scale * proj_scale) | 0;
      
      const b = brightness_arr[i] * (0.4 + proj_scale * 0.6);
      
      if (D > 0.4) {
        arm_count++;
        ctx.globalAlpha = D * b;
        ctx.drawImage(spriteArm, sx - 4, sy - 4, 8, 8);
      } else {
        ctx.globalAlpha = (1 - D) * b * 0.8;
        ctx.drawImage(spriteDisk, sx - 4, sy - 4, 8, 8);
      }
    }
    
    document.getElementById('cnt-arm').textContent = arm_count.toLocaleString();
    
    ctx.globalAlpha = 1.0;
    ctx.globalCompositeOperation = 'source-over';
  }

  // ======== INTERACTION ========
  canvas.addEventListener('pointerdown', (e) => {
    isDragging = true;
    lastX = e.clientX;
    lastY = e.clientY;
    document.body.classList.add('dragging');
    canvas.setPointerCapture(e.pointerId);
  });
  canvas.addEventListener('pointermove', (e) => {
    if (!isDragging) return;
    const dx = e.clientX - lastX;
    const dy = e.clientY - lastY;
    tRotZ -= dx * 0.005;
    tTilt -= dy * 0.005;
    tTilt = Math.max(0.1, Math.min(Math.PI / 2 - 0.1, tTilt));
    lastX = e.clientX;
    lastY = e.clientY;
  });
  canvas.addEventListener('pointerup', (e) => {
    isDragging = false;
    document.body.classList.remove('dragging');
    canvas.releasePointerCapture(e.pointerId);
  });
  canvas.addEventListener('wheel', (e) => {
    e.preventDefault();
    tZoom *= e.deltaY > 0 ? 0.92 : 1.08;
    tZoom = Math.max(0.4, Math.min(3.0, tZoom));
  }, { passive: false });

  // ======== UI HOOKUPS ========
  const speedSlider = document.getElementById('speed');
  const speedVal = document.getElementById('speed-val');
  speedSlider.addEventListener('input', () => {
    speed = parseInt(speedSlider.value) / 100;
    speedVal.textContent = speed.toFixed(2) + '×';
  });

  const dampSlider = document.getElementById('damp');
  const dampVal = document.getElementById('damp-val');
  dampSlider.addEventListener('input', () => {
    damping_strength = parseInt(dampSlider.value) / 100;
    dampVal.textContent = damping_strength.toFixed(2);
  });

  const omegaSlider = document.getElementById('omega');
  const omegaVal = document.getElementById('omega-val');
  omegaSlider.addEventListener('input', () => {
    Omega_p = parseInt(omegaSlider.value) / 100;
    omegaVal.textContent = Omega_p.toFixed(2);
  });

  const pitchSlider = document.getElementById('pitch');
  const pitchVal = document.getElementById('pitch-val');
  pitchSlider.addEventListener('input', () => {
    pitch_deg = parseInt(pitchSlider.value);
    pitchVal.textContent = pitch_deg + '°';
  });

  const armsSlider = document.getElementById('arms');
  const armsVal = document.getElementById('arms-val');
  armsSlider.addEventListener('input', () => {
    num_arms = parseInt(armsSlider.value);
    arm_offset = 2 * Math.PI / num_arms;
    armsVal.textContent = num_arms;
  });

  const btnField = document.getElementById('btn-field');
  btnField.addEventListener('click', () => {
    showField = !showField;
    btnField.classList.toggle('active', showField);
  });
  const btnTrails = document.getElementById('btn-trails');
  btnTrails.addEventListener('click', () => {
    showTrails = !showTrails;
    btnTrails.classList.toggle('active', showTrails);
  });
  document.getElementById('btn-reset').addEventListener('click', () => {
    tRotZ = 0;
    tTilt = 1.2;
    tZoom = 1.0;
  });

  document.getElementById('stat-stars').textContent = (N_DISK + N_BULGE).toLocaleString();
  document.getElementById('cnt-disk').textContent = N_DISK.toLocaleString();
  document.getElementById('cnt-bulge').textContent = N_BULGE.toLocaleString();

  // ======== MAIN LOOP ========
  let lastTime = performance.now();
  let fps = 0, frames = 0, fpsTime = 0;

  function loop(now) {
    const dt = Math.min(0.05, (now - lastTime) / 1000);
    lastTime = now;
    
    rotZ += (tRotZ - rotZ) * 0.1;
    tilt += (tTilt - tilt) * 0.1;
    zoom += (tZoom - zoom) * 0.1;
    
    const sim_dt = dt * speed * 0.5;
    pattern_phase += Omega_p * sim_dt; // Accumulate pattern phase smoothly
    
    render(sim_dt);
    
    frames++;
    fpsTime += dt;
    if (fpsTime >= 0.5) {
      fps = Math.round(frames / fpsTime);
      frames = 0;
      fpsTime = 0;
      document.getElementById('stat-fps').textContent = fps;
      document.getElementById('stat-omega').textContent = Omega_p.toFixed(2);
      document.getElementById('stat-pitch').textContent = pitch_deg + '°';
    }
    
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
  </script>
</body>
</html>
